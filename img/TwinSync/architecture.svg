<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="604" viewBox="0 0 1000 604" role="img" aria-labelledby="title desc">
<title id="title">TwinSync 的双机结构</title><desc id="desc">两台电脑各自运行 C# 后台进程与本机管理页面，经 TLS 直接交换文件清单和文件内容。同一个共享文件夹 ID 可以对应不同本地目录。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M1 1L7 4.5L1 8" fill="none" stroke="#62706b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:'Segoe UI','Microsoft YaHei',sans-serif;fill:#293332}.title{font-size:28px;font-weight:600}.section{font-size:23px;font-weight:600}.body{font-size:21px}.small{font-size:18px;fill:#62706b}.mono{font-family:Consolas,'Microsoft YaHei',monospace;font-size:18px}.accent{font-size:21px;fill:#a65343;font-weight:600}.green{font-size:21px;fill:#386c58;font-weight:600}.number{font-size:20px;fill:#a65343;font-family:Consolas,monospace}</style>
<rect x="1" y="1" width="998" height="602" rx="18" fill="#f8f8f3" stroke="#d8ddd6"/><text x="40" y="54" class="title" text-anchor="start">TwinSync 的双机结构</text><rect x="40" y="92" width="410" height="408" rx="14" fill="#ffffff" stroke="#d8ddd6"/><text x="64" y="130" class="section" text-anchor="start">电脑 A</text><rect x="64" y="152" width="362" height="64" rx="14" fill="#eaf1e9" stroke="#d8ddd6"/><text x="245" y="191" class="body" text-anchor="middle">本机浏览器 · 管理页面</text><path d="M245 217H245V246" fill="none" stroke="#62706b" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="250" width="362" height="104" rx="14" fill="#f7ebe5" stroke="#d8ddd6"/><text x="245" y="286" class="section" text-anchor="middle">TwinSync · C# 后台进程</text><text x="245" y="320" class="small" text-anchor="middle">扫描 / 索引 / 同步 / 历史版本</text><path d="M245 356H245V385" fill="none" stroke="#62706b" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="388" width="362" height="84" rx="14" fill="#eaf1e9" stroke="#d8ddd6"/><text x="245" y="420" class="body" text-anchor="middle">用户授权的文件夹</text><text x="245" y="450" class="mono" text-anchor="middle">D:\Work\Notes</text><rect x="550" y="92" width="410" height="408" rx="14" fill="#ffffff" stroke="#d8ddd6"/><text x="574" y="130" class="section" text-anchor="start">电脑 B</text><rect x="574" y="152" width="362" height="64" rx="14" fill="#eaf1e9" stroke="#d8ddd6"/><text x="755" y="191" class="body" text-anchor="middle">本机浏览器 · 管理页面</text><path d="M755 217H755V246" fill="none" stroke="#62706b" stroke-width="2" marker-end="url(#arrow)"/><rect x="574" y="250" width="362" height="104" rx="14" fill="#f7ebe5" stroke="#d8ddd6"/><text x="755" y="286" class="section" text-anchor="middle">TwinSync · C# 后台进程</text><text x="755" y="320" class="small" text-anchor="middle">扫描 / 索引 / 同步 / 历史版本</text><path d="M755 356H755V385" fill="none" stroke="#62706b" stroke-width="2" marker-end="url(#arrow)"/><rect x="574" y="388" width="362" height="84" rx="14" fill="#eaf1e9" stroke="#d8ddd6"/><text x="755" y="420" class="body" text-anchor="middle">用户授权的文件夹</text><text x="755" y="450" class="mono" text-anchor="middle">E:\Shared\Notes</text><path d="M436 300H564" fill="none" stroke="#62706b" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="500" y="263" class="mono" text-anchor="middle">TLS 1.2</text><text x="500" y="337" class="small" text-anchor="middle">直连</text><text x="40" y="542" class="body" text-anchor="start">同一个 folderId，映射到两台电脑各自选择的目录。</text><text x="40" y="576" class="small" text-anchor="start">浏览器负责管理；关闭页面后，后台进程仍可继续同步。</text></svg>
