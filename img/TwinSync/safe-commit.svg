<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="734" viewBox="0 0 1000 734" role="img" aria-labelledby="title desc">
<title id="title">断点续传与文件提交的边界</title><desc id="desc">断点续传只确认已完成且校验落盘的分块。完整文件接收后仍须验证完整哈希、本地内容与当前授权，通过后才备份并原子提交。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M1 1L7 4.5L1 8" fill="none" stroke="#62706b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:'Segoe UI','Microsoft YaHei',sans-serif;fill:#293332}.title{font-size:28px;font-weight:600}.section{font-size:23px;font-weight:600}.body{font-size:21px}.small{font-size:18px;fill:#62706b}.mono{font-family:Consolas,'Microsoft YaHei',monospace;font-size:18px}.accent{font-size:21px;fill:#a65343;font-weight:600}.green{font-size:21px;fill:#386c58;font-weight:600}.number{font-size:20px;fill:#a65343;font-family:Consolas,monospace}</style>
<rect x="1" y="1" width="998" height="732" rx="18" fill="#f8f8f3" stroke="#d8ddd6"/><text x="40" y="54" class="title" text-anchor="start">断点续传与文件提交的边界</text><text x="40" y="104" class="body" text-anchor="start">传输阶段：每块最多 4 MiB，校验并落盘后才确认位置。</text><rect x="40" y="126" width="174" height="68" rx="14" fill="#eaf1e9" stroke="#d8ddd6"/><text x="127" y="167" class="body" text-anchor="middle">块 0</text><rect x="226" y="126" width="174" height="68" rx="14" fill="#eaf1e9" stroke="#d8ddd6"/><text x="313" y="167" class="body" text-anchor="middle">块 1</text><rect x="412" y="126" width="174" height="68" rx="14" fill="#f7ebe5" stroke="#d8ddd6"/><text x="499" y="167" class="accent" text-anchor="middle">块 2</text><rect x="598" y="126" width="174" height="68" rx="14" fill="#ffffff" stroke="#d8ddd6"/><text x="685" y="167" class="body" text-anchor="middle">块 3</text><rect x="784" y="126" width="174" height="68" rx="14" fill="#ffffff" stroke="#d8ddd6"/><text x="871" y="167" class="body" text-anchor="middle">块 4</text><text x="127" y="224" class="small" text-anchor="middle">已确认</text><text x="313" y="224" class="small" text-anchor="middle">已确认</text><text x="499" y="224" class="small" text-anchor="middle">中断，从此块重传</text><text x="778" y="224" class="small" text-anchor="middle">尚未完成</text><path d="M500 245H500V278" fill="none" stroke="#62706b" stroke-width="2" marker-end="url(#arrow)"/><rect x="240" y="282" width="520" height="66" rx="14" fill="#ffffff" stroke="#d8ddd6"/><text x="500" y="323" class="section" text-anchor="middle">完整临时文件 · 尚未覆盖正式文件</text><path d="M500 350H500V382" fill="none" stroke="#62706b" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="386" width="920" height="108" rx="14" fill="#f7ebe5" stroke="#d8ddd6"/><text x="500" y="425" class="accent" text-anchor="middle">提交门槛</text><text x="500" y="464" class="body" text-anchor="middle">完整 SHA-256 通过   +   本地内容未变化   +   当前授权仍有效</text><path d="M500 496H500V530" fill="none" stroke="#62706b" stroke-width="2" marker-end="url(#arrow)"/><path d="M270 530H730" fill="none" stroke="#62706b" stroke-width="2"/><path d="M270 530H270V558" fill="none" stroke="#62706b" stroke-width="2" marker-end="url(#arrow)"/><path d="M730 530H730V558" fill="none" stroke="#62706b" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="562" width="460" height="94" rx="14" fill="#eaf1e9" stroke="#d8ddd6"/><text x="270" y="600" class="green" text-anchor="middle">检查通过</text><text x="270" y="633" class="small" text-anchor="middle">按版本设置备份，再原子提交正式文件</text><rect x="530" y="562" width="430" height="94" rx="14" fill="#ffffff" stroke="#d8ddd6"/><text x="745" y="600" class="accent" text-anchor="middle">检查失败</text><text x="745" y="633" class="small" text-anchor="middle">停止提交，保留正式文件并报告原因</text><text x="40" y="703" class="small" text-anchor="start">断点属于这次文件内容和授权；文件变更或授权撤销后，旧任务不能直接复用。</text></svg>
