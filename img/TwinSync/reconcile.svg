<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
<title id="title">从文件变化到同步决策</title><desc id="desc">文件事件进入路径队列，扫描后更新索引，双方交换清单，再按照内容、版本次序、同步方向和冲突策略决定 same、push、pull 或 none。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M1 1L7 4.5L1 8" fill="none" stroke="#62706b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:'Segoe UI','Microsoft YaHei',sans-serif;fill:#293332}.title{font-size:28px;font-weight:600}.section{font-size:23px;font-weight:600}.body{font-size:21px}.small{font-size:18px;fill:#62706b}.mono{font-family:Consolas,'Microsoft YaHei',monospace;font-size:18px}.accent{font-size:21px;fill:#a65343;font-weight:600}.green{font-size:21px;fill:#386c58;font-weight:600}.number{font-size:20px;fill:#a65343;font-family:Consolas,monospace}</style>
<rect x="1" y="1" width="998" height="678" rx="18" fill="#f8f8f3" stroke="#d8ddd6"/><text x="40" y="54" class="title" text-anchor="start">从文件变化到同步决策</text><rect x="40" y="98" width="270" height="148" rx="14" fill="#ffffff" stroke="#d8ddd6"/><text x="60" y="129" class="number" text-anchor="start">01</text><text x="60" y="165" class="section" text-anchor="start">文件变化事件</text><text x="60" y="199" class="small" text-anchor="start">文件新增、修改与删除</text><text x="60" y="226" class="mono" text-anchor="start">FileSystemWatcher</text><rect x="365" y="98" width="270" height="148" rx="14" fill="#ffffff" stroke="#d8ddd6"/><text x="385" y="129" class="number" text-anchor="start">02</text><text x="385" y="165" class="section" text-anchor="start">待扫描路径队列</text><text x="385" y="199" class="small" text-anchor="start">合并重复路径与嵌套范围</text><text x="385" y="226" class="small" text-anchor="start">异常时标记为全量核对</text><rect x="690" y="98" width="270" height="148" rx="14" fill="#ffffff" stroke="#d8ddd6"/><text x="710" y="129" class="number" text-anchor="start">03</text><text x="710" y="165" class="section" text-anchor="start">扫描与本地索引</text><text x="710" y="199" class="small" text-anchor="start">哈希、修订号与删除标记</text><text x="710" y="226" class="small" text-anchor="start">保留周期性全量核对</text><path d="M311 171H363" fill="none" stroke="#62706b" stroke-width="2" marker-end="url(#arrow)"/><path d="M636 171H688" fill="none" stroke="#62706b" stroke-width="2" marker-end="url(#arrow)"/><path d="M825 248V285H500V318" fill="none" stroke="#62706b" stroke-width="2" marker-end="url(#arrow)"/><rect x="210" y="322" width="580" height="108" rx="14" fill="#f7ebe5" stroke="#d8ddd6"/><text x="500" y="362" class="section" text-anchor="middle">交换双方清单，对相对路径取并集</text><text x="500" y="397" class="small" text-anchor="middle">比较内容与版本次序，再应用目录方向和冲突策略</text><path d="M500 432H500V466" fill="none" stroke="#62706b" stroke-width="2" marker-end="url(#arrow)"/><path d="M140 466H860" fill="none" stroke="#62706b" stroke-width="2"/><path d="M140 466H140V497" fill="none" stroke="#62706b" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="501" width="200" height="100" rx="14" fill="#eaf1e9" stroke="#d8ddd6"/><text x="140" y="538" class="mono" text-anchor="middle">same</text><text x="140" y="575" class="small" text-anchor="middle">内容一致，确认状态</text><path d="M380 466H380V497" fill="none" stroke="#62706b" stroke-width="2" marker-end="url(#arrow)"/><rect x="280" y="501" width="200" height="100" rx="14" fill="#ffffff" stroke="#d8ddd6"/><text x="380" y="538" class="mono" text-anchor="middle">push</text><text x="380" y="575" class="small" text-anchor="middle">发送文件或删除</text><path d="M620 466H620V497" fill="none" stroke="#62706b" stroke-width="2" marker-end="url(#arrow)"/><rect x="520" y="501" width="200" height="100" rx="14" fill="#ffffff" stroke="#d8ddd6"/><text x="620" y="538" class="mono" text-anchor="middle">pull</text><text x="620" y="575" class="small" text-anchor="middle">接收文件或删除</text><path d="M860 466H860V497" fill="none" stroke="#62706b" stroke-width="2" marker-end="url(#arrow)"/><rect x="760" y="501" width="200" height="100" rx="14" fill="#eaf1e9" stroke="#d8ddd6"/><text x="860" y="538" class="mono" text-anchor="middle">none</text><text x="860" y="575" class="small" text-anchor="middle">方向限制，本轮不传输</text><text x="40" y="650" class="body" text-anchor="start">传输前后还要检查权限和文件状态；比较结果不是无条件覆盖许可。</text></svg>
